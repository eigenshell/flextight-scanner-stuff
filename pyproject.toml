[project]
name = "flextight"
version = "0.1.0"
description = "Linux driver and tooling for Imacon/Hasselblad Flextight SCSI scanners"
requires-python = ">=3.10"

[project.scripts]
flextight = "flextight.cli:main"

[project.optional-dependencies]
test = ["rawpy", "numpy"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["hardware: requires attached scanner"]
addopts = "-m 'not hardware'"
